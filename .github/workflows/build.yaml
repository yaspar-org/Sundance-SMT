name: Build
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Setup Z3
        uses: ./.github/actions/setup-z3

      - name: Run cargo check
        run: cargo check --no-default-features --features local-z3

      - name: Run copyright check
        run: |
          ./.github/copyright-check.sh src
          ./.github/copyright-check.sh tests
          ./.github/copyright-check.sh benches

  test:
    name: Test Suite (${{ matrix.arithmetic }}, ${{ matrix.os }})
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        arithmetic: [ internal, z3, z3incremental ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew update && brew install cmake

      - name: Setup Z3
        uses: ./.github/actions/setup-z3

      - name: Run tests
        env:
          SUNDANCE_ARITHMETIC: ${{ matrix.arithmetic }}
        run: cargo test --release --no-default-features --features local-z3 -- --nocapture

  lints:
    name: Lints
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Setup Z3
        uses: ./.github/actions/setup-z3

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --no-default-features --features local-z3 --tests -- -D warnings

      - name: Run rustdoc lints
        run: cargo doc --workspace --no-default-features --features local-z3 --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Setup Z3
        uses: ./.github/actions/setup-z3

      - name: Build documentation
        run: cargo doc --no-default-features --features local-z3 --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
