name: Build
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - uses: Swatinem/rust-cache@v1

      - name: Get z3 submodule commit
        id: z3-rev
        run: echo "hash=$(git submodule status z3 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Cache z3 build
        uses: actions/cache@v4
        with:
          path: target/debug/build/z3-sys-*
          key: ${{ runner.os }}-z3-debug-${{ steps.z3-rev.outputs.hash }}

      - name: Run cargo check
        uses: actions-rs/cargo@v1
        with:
          command: check

      - name: Run copyright check
        run: |
          ./.github/copyright-check.sh src
          ./.github/copyright-check.sh tests
          ./.github/copyright-check.sh benches

  test:
    name: Test Suite
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        rust: [ stable ]
        features:
          - 'default'
          - ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true

      - name: Install build dependencies (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake z3 libz3-dev

      - name: Install Homebrew dependencies (Mac)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          brew update
          brew install cmake

      - name: Get z3 submodule commit
        if: ${{ matrix.features == 'default' }}
        id: z3-rev
        run: echo "hash=$(git submodule status z3 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Cache z3 build
        if: ${{ matrix.features == 'default' }}
        uses: actions/cache@v4
        with:
          path: target/release/build/z3-sys-*
          key: ${{ runner.os }}-z3-${{ steps.z3-rev.outputs.hash }}

      - name: Run tests
        run: cargo test --release --no-default-features --features "${{ matrix.features }}" -- --nocapture

  lints:
    name: Lints
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v1

      - name: Get z3 submodule commit
        id: z3-rev
        run: echo "hash=$(git submodule status z3 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Cache z3 build
        uses: actions/cache@v4
        with:
          path: target/debug/build/z3-sys-*
          key: ${{ runner.os }}-z3-debug-${{ steps.z3-rev.outputs.hash }}

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: Run cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-features --tests -- -D warnings

      - name: Run rustdoc lints
        uses: actions-rs/cargo@v1
        env:
          RUSTDOCFLAGS: ""
        with:
          command: doc
          args: --workspace --all-features --no-deps --document-private-items

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Get z3 submodule commit
        id: z3-rev
        run: echo "hash=$(git submodule status z3 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Cache z3 build
        uses: actions/cache@v4
        with:
          path: target/debug/build/z3-sys-*
          key: ${{ runner.os }}-z3-debug-${{ steps.z3-rev.outputs.hash }}

      - name: Build documentation
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
