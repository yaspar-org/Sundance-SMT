[package]
name = "sundance-smt"
version = "0.2.0"
edition = "2024"
readme = "README.md"
license = "Apache-2.0"
description = "An SMT solver for program verification"
authors = ["the Amazon Trusted Solver team"]
keywords = ["SMT", "solver", "logic"]
categories = ["science"]
homepage = "https://github.com/yaspar-org/Sundance-SMT"
repository = "https://github.com/yaspar-org/Sundance-SMT"

[features]
default = ["bundled-z3"]
# Swap the e-graph backend for the semi-persistent engine (semper): the
# adapter in src/egraphs/semper implements EgraphTrait over it.
semper-egraph = ["dep:semi-persistent-egraph"]
z3-solver = ["dep:z3"]
bundled-z3 = ["z3-solver", "z3/bundled"]
local-z3 = ["z3-solver"]
minisat = ["sat-interface/minisat"]

[dependencies]
yaspar-ir = { version = "=2.7.7", features = ["cache", "no-pattern"] }
semi-persistent-egraph = { git = "https://github.com/yaspar-org/semi-persistent.git", rev = "695a909619f05a81691a1e2442eadfb4e6f52a9d", optional = true }
sat-interface = "0.1.2"
# Pin the fork until upstream cadical-sys moves to CaDiCaL 3.0.1
cadical-sys = { git = "https://github.com/leeabarnett/cadical-sys.git", branch = "cadical-3.0.1" }

array2d = "^0.3"
clap = { version = "4.5.40", features = ["derive"] }
dashu = { version = "^0.4", features = ["num-traits"] }
num-traits = "^0.2"
serde_json = "1.0"
z3 = { version = "0.21", optional = true, features = ["num"] }
num = "0.4.3"
rustc-hash = "2.0"
bimap = "0.6.3"

[dev-dependencies]
serde_json = "1.0"
criterion = "0.5"

[[test]]
name = "regression_test"
harness = true

[profile.release]
debug = true
# causes GitHub CI to fail when older CPU runners are selected
# lto = "fat"
# codegen-units = 1

[lib]
name = "sundance_smt"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "sundance-smt"

[[bench]]
name = "tableau_benchmarks"
harness = false

[[bench]]
name = "lia_benchmarks"
harness = false
