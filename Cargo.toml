[package]
name = "sundance-smt"
version = "0.2.0"
edition = "2024"
readme = "README.md"
license = "Apache-2.0"
description = "An SMT solver for program verification"
authors = ["the Amazon Trusted Solver team"]
keywords = ["SMT", "solver", "logic"]
categories = ["science"]
homepage = "https://github.com/yaspar-org/Sundance-SMT"
repository = "https://github.com/yaspar-org/Sundance-SMT"

[features]
default = ["bundled-z3"]
z3-solver = ["dep:z3"]
bundled-z3 = ["z3-solver", "z3/bundled"]
local-z3 = ["z3-solver"]
# Swap the e-graph backend for the semi-persistent engine. EUF only for now:
# arithmetic modes need the merge-observation hook (see egraphs/semper), so
# run with --arith-solver none.
semper-egraph = ["dep:semi-persistent-egraph"]

[dependencies]
# Temporary: yaspar-ir 2.7.6 (single-term :no-pattern) is not yet published to
# crates.io; pin to the main checkpoint until it is released, then restore the
# `version = "=2.7.6"` crates.io pin.
yaspar-ir = { git = "https://github.com/yaspar-org/yaspar-ir.git", rev = "483d34188b9b6b728386da158ba672e816ed077b", features = ["no-pattern"] }
sat-interface = "0.1.1"
# Pin the elevate fork until upstream cadical-sys exposes CaDiCaL's elevate option.
cadical-sys = { git = "https://github.com/amarshah1/cadical-sys.git", rev = "2f234ec95dd36ca74057691cf2fd4e8766a3c40f" }

# Pinned to the semi-persistent repo (branch satcore-layer0) so this branch
# builds from a single clone with no sibling checkout. For local
# co-development, override with `[patch]` or a path dependency.
semi-persistent-egraph = { git = "https://github.com/yaspar-org/semi-persistent.git", rev = "ec1eb8ae1387ce42986ecb87c3ce32f78264f9c6", optional = true }

array2d = "^0.3"
clap = { version = "4.5.40", features = ["derive"] }
dashu = { version = "^0.4", features = ["num-traits"] }
num-traits = "^0.2"
serde_json = "1.0"
z3 = { version = "0.19.8", optional = true }
num = "0.4.3"
rustc-hash = "2.0"
bimap = "0.6.3"

[dev-dependencies]
serde_json = "1.0"
criterion = "0.5"

[[test]]
name = "regression_test"
harness = true

[profile.release]
debug = true
# causes GitHub CI to fail when older CPU runners are selected
# lto = "fat"
# codegen-units = 1

[lib]
name = "sundance_smt"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "sundance-smt"

[[bench]]
name = "tableau_benchmarks"
harness = false

[[bench]]
name = "lia_benchmarks"
harness = false
